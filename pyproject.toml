[project]
name = "ched-cmo-pipeline"
version = "0.2.0"
description = "Pipeline to fetch and compile CHED Memorandum Orders (CMOs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "crawlee[playwright]>=1.8.2",
    "cryptography>=49.0.0",
    "curl-cffi>=0.15.0",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ched_ocr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: hits local PDFs / tesseract"]
