[project]
name = "ched-cmo-pipeline"
version = "0.1.0"
description = "Pipeline to fetch and compile CHED Memorandum Orders (CMOs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cloudscraper>=1.2.71",
    "crawlee[playwright]>=1.8.2",
    "cryptography>=49.0.0",
    "curl-cffi>=0.15.0",
    "httpx>=0.27.0",
    "playwright>=1.61.0",
    "playwright-stealth>=2.0.3",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.0.1",
]
